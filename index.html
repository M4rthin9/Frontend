<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ระบบจองคิวเพื่อร่วมกิจกรรม · ทัณฑสถานบำบัดพิเศษกลาง" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <!-- Installable web app: iPhone only allows Web Push for a site added to the Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CC Cafe" />
    <link rel="preload" as="image" href="/cida-logo-192.webp" fetchpriority="high" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/kanit-700-thai.woff2"
      crossorigin
    />
    <title>ระบบจองคิวเพื่อร่วมกิจกรรม</title>
    <style>
      /* Match the app theme before JavaScript mounts. */
      html,
      body {
        margin: 0;
        background: #dfe6ef;
      }
      html.dark,
      html.dark body {
        background: #1a2231;
      }
    </style>
    <script>
      // Charcoal by default; preserve an explicit light preference.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('ccc_dark_mode');
        } catch (e) {
          /* storage unavailable */
        }
        document.documentElement.classList.toggle('dark', saved !== '0');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
