<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ระบบจองคิวเพื่อร่วมกิจกรรม · ทัณฑสถานบำบัดพิเศษกลาง" />
    <meta name="theme-color" content="#a92928" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="preload" as="image" href="/cida-logo-192.webp" fetchpriority="high" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/kanit-700-thai.woff2"
      crossorigin
    />
    <title>ระบบจองคิวเพื่อร่วมกิจกรรม</title>
    <style>
      /* Pre-paint: cool slate tint (official) — avoids flash before app mounts */
      html,
      body {
        margin: 0;
        background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      }
    </style>
    <script>
      // Pre-paint theme: default to light; only apply dark when explicitly chosen.
      (function () {
        try {
          var saved = localStorage.getItem('ccc_dark_mode');
          if (saved === '1') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.background = '#0f172a';
          }
        } catch (e) {
          /* storage unavailable — fall through */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
